# MWP deployment override — OpenDots in OrbStack (owner GO 2026-10-27).
# Standalone: docker compose -f compose.mwp.yml up -d
# Keeps the owner's door: https://brians-mac-studio.tailab784e.ts.net:5173 (tailscale
# serve proxies to this published port). MWP 2026-10-30: publish moved from the tailnet
# IP to 127.0.0.1 — the raw http://100.81.213.106:5173 door shadowed the serve TLS
# listener on the same port and could never work as named HTTPS (registry:
# MWP/workspaces/STUDIO-SERVE-DOORS.md).
# Honey's brain stays on the host engine adapter, reached via host.docker.internal.
services:
  app:
    build:
      context: .
      target: app
    container_name: opendots-app
    ports:
      # MWP 2026-10-30T21:3xZ — LOOPBACK-ONLY (OpenCode, Studio seat, owner-DM fix). The
      # tailnet-IP publish on the same port SHADOWS the tailscale serve TLS listener —
      # with serve :5173 ON, Brian's taps on the canonical https door hit the plain-HTTP
      # container and die (TLS alert protocol version). Owner law (SERVICES.md owner
      # surfaces): the ONLY OpenDots door is https://brians-mac-studio.tailab784e.ts.net:5173
      # — serve :5173 ON + loopback publish is the only topology where that door exists.
      # The ~20:55Z dual-publish and its raw-IP "icon lane" are retired by this change;
      # raw-number http doors are dead by the owner link law anyway (never shipped).
      - "127.0.0.1:5173:4310"
    env_file:
      - .env
    environment:
      # MWP 2026-10-29: OpenBot's plain AG-UI door (SSE event stream on the response). The
      # Intelligence route (/api/copilotkit/agent/honey/run) answers with a join-token envelope
      # and would try to create this workspace's thread id as its own agent on the shared
      # Intelligence platform — globally unique thread ids make that a 409/404 and every turn
      # dies "Failed to initialize thread". The AG-UI door runs the same Bot (same tools, role,
      # signed-run treatment) and streams back what an HttpAgent consumes.
      REMOTE_DOT_AGENTS: "Honey=http://host.docker.internal:3002/api/agui/agent/honey/run"
      # self-hosted Intelligence lives on the host k3d (loopback :51410/:51412);
      # .env's localhost values would point at the container itself (Pi, live-tested)
      # [PI-GWFIX-20261030] cpk runtime 1.75.0 hands the SERVER's own gateway URL to browsers
      # (deriveClientWsUrl — no public-URL override), so host.docker.internal here meant every
      # phone chat died silently at the realtime WS (RUN envelope clientUrl unreachable).
      # Fix: serve :9444 -> 127.0.0.1:51412 (tailscale) and use that URL for BOTH server and
      # browser. Container->door reachability live-tested 2026-10-30T21:5xZ (Pi).
      INTELLIGENCE_API_URL: "http://host.docker.internal:51410"
      INTELLIGENCE_GATEWAY_WS_URL: "wss://brians-mac-studio.tailab784e.ts.net:9444"
      BROWSER_URL: ""
      DATABASE_PATH: /data/opendots.sqlite
      # MWP 2026-10-30: Brian's inbox — the kanban ask register, bind-mounted (not baked
      # into the image) so the team updates it without rebuilds. Read per request at
      # /api/owner-inbox; directory mount so git checkouts (inode replacement) stay live.
      OWNER_INBOX_PATH: /inbox/owner-inbox.json
      HOST: 0.0.0.0
      PORT: "4310"
    volumes:
      - opendots-data:/data
      - /Users/silverhawk/GitHub/MWP/kanban:/inbox:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  opendots-data:
    name: opendots-data
